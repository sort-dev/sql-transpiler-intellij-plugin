name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Test on IDEA 262, Kotlin absent
        run: ./gradlew test

      - name: Download latest sibling plugin ZIPs for classloader isolation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=()
          for sibling in clickhouse doris duckdb trino; do
            dir="$RUNNER_TEMP/siblings/$sibling"
            gh release download --repo "sort-dev/$sibling-intellij-plugin" --pattern "$sibling-intellij-plugin-*.zip" --dir "$dir"
            zips=("$dir"/*.zip)
            [[ ${#zips[@]} -eq 1 ]] || { echo "Expected one $sibling release ZIP, found: ${zips[*]}"; exit 1; }
            echo "Using ${zips[0]}"
            args+=("-Ptest.${sibling}PluginZip=${zips[0]}")
          done
          echo "SIBLING_PLUGIN_ZIPS=${args[*]}" >> "$GITHUB_ENV"

      - name: Test packaged plugin classloaders on IDEA 262
        run: ./gradlew test -Ptest.pluginIsolation=true $SIBLING_PLUGIN_ZIPS

      - name: Test optional Kotlin host guards on IDEA 262, Kotlin present
        run: ./gradlew test -Ptest.kotlin=present --tests '*InspectionHostPlatformTest' --tests '*EditorPopupKotlinPlatformTest'

      - name: Test on IDEA 263, Kotlin absent
        run: ./gradlew test263

      - name: Test packaged plugin classloaders on IDEA 263
        run: ./gradlew test263 -Ptest.pluginIsolation=true $SIBLING_PLUGIN_ZIPS

      - name: Test optional Kotlin host guards on IDEA 263, Kotlin present
        run: ./gradlew test263 -Ptest.kotlin=present

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin

      - name: Upload compatibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier/
          if-no-files-found: warn

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/
