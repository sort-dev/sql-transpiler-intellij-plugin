name: CI

on:
  push:
    branches: [ main, 'release-*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test

      - name: Test packaged plugin classloaders
        run: ./gradlew test -Ptest.pluginIsolation=true

      - name: Test optional Kotlin host guards
        run: ./gradlew test -Ptest.kotlinHosts=true --tests '*InspectionHostPlatformTest'

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin

      - name: Upload compatibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier/
          if-no-files-found: warn

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/

  release:
    name: GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref_name, 'release-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download plugin zip
        uses: actions/download-artifact@v4
        with:
          name: plugin-zip
          path: dist

      - name: Read version from build.gradle.kts
        id: ver
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "version: $V"

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$V"
          ZIP=$(ls dist/*.zip | head -1)
          RENAMED="dist/sql-transpiler-intellij-plugin-${V}.zip"
          mv "$ZIP" "$RENAMED"
          # Creating the ref is atomic and fails if this version already exists, even
          # when a previous run created the tag but did not finish creating the release.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/v$V" -f "sha=$GITHUB_SHA"
          gh release create "v$V" "$RENAMED" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "SQL Transpiler $V" \
            --notes "Plugin zip for manual installation (Settings → Plugins → ⚙ → Install Plugin from Disk).
          Built from \`$GITHUB_REF_NAME\` @ $GITHUB_SHA. See plugin.xml change-notes for details."
