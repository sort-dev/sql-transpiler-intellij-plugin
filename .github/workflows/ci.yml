name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Test on IDEA 261, Kotlin absent
        run: ./gradlew test

      - name: Test packaged plugin classloaders on IDEA 261
        run: ./gradlew test -Ptest.pluginIsolation=true

      - name: Test optional Kotlin host guards on IDEA 261, Kotlin present
        run: ./gradlew test -Ptest.kotlin=present --tests '*InspectionHostPlatformTest'

      - name: Test on IDEA 263, Kotlin absent
        run: ./gradlew test263

      - name: Test packaged plugin classloaders on IDEA 263
        run: ./gradlew test263 -Ptest.pluginIsolation=true

      - name: Test optional Kotlin host guards on IDEA 263, Kotlin present
        run: ./gradlew test263 -Ptest.kotlin=present

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin

      - name: Upload compatibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier/
          if-no-files-found: warn

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/
